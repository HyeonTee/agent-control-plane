# Production stack on the existing EC2 instance. It never joins Justice's
# Compose project or exposes PostgreSQL outside this private network.
name: agent-control-plane-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - /opt/agent-control-plane/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 30

  hub:
    image: ${HUB_IMAGE:?}
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      HUB_ENV: production
      HUB_HTTP_ADDR: :8080
      HUB_DATABASE_URL: postgres://hub:${DB_PASSWORD:?}@db:5432/hub?sslmode=disable
      HUB_ORIGIN_SECRET: ${ORIGIN_SECRET:?}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /opt/agent-control-plane/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/agent-control-plane/tls:/etc/hub-tls:ro
    depends_on:
      - hub
